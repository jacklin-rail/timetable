<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣鐵路時刻查詢</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9480f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鐵路時刻">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif;
         background:#f6f4f1; color:#333; margin:0; padding:16px; display:flex; justify-content:center; }
  .container { width:100%; max-width:480px; background:#fff; padding:22px 18px; border-radius:12px;
               box-shadow:0 4px 12px rgba(0,0,0,.1); text-align:center; }
  h1 { margin:0 0 6px; font-size:1.4rem; }
  p.sub { margin:0 0 20px; color:#777; font-size:.9rem; }
  a.card { display:block; text-decoration:none; padding:18px; margin-bottom:12px; border-radius:10px;
           font-size:1.15rem; font-weight:bold; border:2px solid; }
  a.thsr { color:#d9480f; border-color:#d9480f; background:#fff4ec; }
  a.tra  { color:#0056b3; border-color:#0056b3; background:#f0f6ff; }
  a.card:active { opacity:.7; }
  #installBtn { display:none; width:100%; padding:12px; border:none; border-radius:8px; background:#333;
                color:#fff; font-size:1rem; font-weight:bold; margin-top:6px; }
  .hint { font-size:.8rem; color:#888; margin-top:16px; line-height:1.5; }
</style>
</head>
<body>
<div class="container">
  <h1>🚉 台灣鐵路時刻查詢</h1>
  <p class="sub">資料來源：交通部 TDX 運輸資料流通服務</p>
  <a class="card thsr" href="thsr-timetable.html">🚄 高鐵時刻查詢</a>
  <a class="card tra" href="tra-timetable.html">🚆 台鐵時刻查詢</a>
  <button id="installBtn" type="button">📲 安裝到主畫面</button>
  <div class="hint">iPhone：Safari 點「分享」→「加入主畫面」<br>Android：瀏覽器選單 →「安裝應用程式」</div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    document.getElementById('installBtn').style.display = 'block';
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    document.getElementById('installBtn').style.display = 'none';
  });
</script>
</body>
</html>
